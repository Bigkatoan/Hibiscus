# Prometheus for the Hibiscus stack. Every target is on the internal `obs` Docker network; none of
# these endpoints is routed through the reverse proxy (the proxy 404s /metrics).
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    stack: hibiscus

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # FastAPI /metrics (operationId prometheusMetrics). Expected metric names: docs/runbook/observability.md
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # Worker processes expose prometheus_client metrics on HIBISCUS_METRICS_PORT (9108).
  - job_name: workers
    static_configs:
      - targets: ["worker-cuda0:9108"]
        labels: {gpu_node: cuda0}
      - targets: ["worker-cuda1:9108"]
        labels: {gpu_node: cuda1}
      - targets: ["worker-cpu:9108"]
        labels: {gpu_node: none}

  # Queue depth, run states, GPU node heartbeats (aggregate SQL, deploy/observability/postgres-exporter)
  - job_name: postgres
    scrape_interval: 30s
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # nvidia-smi exporter: utilisation, VRAM, temperature, power per physical GPU
  - job_name: gpu
    static_configs:
      - targets: ["gpu-exporter:9835"]

  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    scrape_interval: 60s
    static_configs:
      - targets: ["minio:9000"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
