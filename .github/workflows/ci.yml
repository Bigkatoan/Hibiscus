# Hibiscus CI. Every job is also runnable locally through the Makefile (`make ci`) and mirrors the
# commands in CONTRIBUTING.md. GPU-marked tests never run here (no GPU on hosted runners).
# Jobs for a component are skipped while that component does not exist yet (hashFiles guards),
# so the workflow is valid during Phase 2 when only parts of the monorepo are present.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.8"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22.12.0"
  PNPM_VERSION: "9.15.0"
  FORCE_COLOR: "1"

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with: {version: "${{ env.UV_VERSION }}"}
      - name: OpenAPI is valid
        run: uvx --python "$PYTHON_VERSION" --from "openapi-spec-validator>=0.7" openapi-spec-validator api/openapi.yaml

  python:
    # One job per uv project: backend, worker (CPU-only), cli, deploy tooling.
    name: ${{ matrix.project }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {project: backend, mypy: "app", pytest: "-m 'not gpu and not slow' --cov --cov-report=term-missing"}
          # LeRobot + torch are large: the worker job frees runner disk first and hides any GPU.
          - {project: worker, mypy: ".", pytest: "-m 'not gpu and not slow' --cov --cov-report=term-missing", big: true}
          - {project: cli, mypy: "hibiscus", pytest: "-m 'not gpu and not slow' --cov --cov-report=term-missing"}
          # the full-stack smoke test (-m slow) runs in `deploy-smoke`
          - {project: deploy, mypy: "scripts tests cloudflare/edge", pytest: "-m 'not slow'"}
    env:
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v7.0.1
      - id: present
        run: |
          if [ -f "${{ matrix.project }}/pyproject.toml" ]; then echo "yes=true" >> "$GITHUB_OUTPUT"; else echo "yes=false" >> "$GITHUB_OUTPUT"; fi
      - name: Free disk space (torch / LeRobot wheels)
        if: steps.present.outputs.yes == 'true' && matrix.big
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - if: steps.present.outputs.yes == 'true'
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "${{ env.UV_VERSION }}"
          enable-cache: true
          cache-dependency-glob: "${{ matrix.project }}/uv.lock"
      - name: Sync
        if: steps.present.outputs.yes == 'true'
        working-directory: ${{ matrix.project }}
        run: |
          if [ -f uv.lock ]; then uv lock --check; uv sync --locked --python "$PYTHON_VERSION"; else uv sync --python "$PYTHON_VERSION"; fi
      - name: Ruff
        if: steps.present.outputs.yes == 'true'
        working-directory: ${{ matrix.project }}
        run: uv run ruff check . && uv run ruff format --check .
      - name: Mypy (strict)
        if: steps.present.outputs.yes == 'true'
        working-directory: ${{ matrix.project }}
        run: uv run mypy --strict ${{ matrix.mypy }}
      - name: Tests
        if: steps.present.outputs.yes == 'true'
        working-directory: ${{ matrix.project }}
        # testcontainers (Postgres, Redis, MinIO) use the runner's Docker daemon.
        run: uv run pytest -q ${{ matrix.pytest }}

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - id: present
        run: |
          if [ -f frontend/package.json ]; then echo "yes=true" >> "$GITHUB_OUTPUT"; else echo "yes=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.present.outputs.yes == 'true'
        uses: pnpm/action-setup@v6.1.1
        with: {version: "${{ env.PNPM_VERSION }}"}
      - if: steps.present.outputs.yes == 'true'
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: install, generated client up to date, lint, typecheck, format, test, build
        if: steps.present.outputs.yes == 'true'
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm gen:api && git diff --exit-code -- src/api/generated
          pnpm lint
          pnpm typecheck
          pnpm exec prettier --check .
          pnpm coverage
          pnpm build
      - name: Station SPA build + generated Station API types up to date
        if: steps.present.outputs.yes == 'true'
        working-directory: frontend
        run: |
          pnpm check:station-api
          pnpm build:station

  station:
    # Hibiscus Station (station/): CPU only, mock hardware; `hil` (real SO-101) and `slow` tests are
    # deselected by the pytest defaults in station/pyproject.toml.
    name: station (CPU, mock hardware)
    runs-on: ubuntu-24.04
    env:
      CUDA_VISIBLE_DEVICES: ""
    defaults:
      run: {working-directory: station}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Free disk space (torch / LeRobot wheels)
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "${{ env.UV_VERSION }}"
          enable-cache: true
          cache-dependency-glob: "station/uv.lock"
      - name: Sync
        run: uv lock --check && uv sync --locked --python "$PYTHON_VERSION"
      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy hibiscus_station
      - name: Tests (no hardware, no GPU)
        run: uv run pytest -q
      - name: openapi.json up to date
        run: uv run hibiscus-station openapi /tmp/station-openapi.json && diff -u openapi.json /tmp/station-openapi.json
      - name: API-only wheel builds
        env: {HIBISCUS_STATION_ALLOW_NO_WEB: "1"}
        run: uv build --wheel -o dist

  station-e2e:
    # Browser end-to-end tests of the Station SPA served by hibiscus-station (mock hardware).
    name: station e2e (playwright, mock hardware)
    runs-on: ubuntu-24.04
    needs: [station]
    env:
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v7.0.1
      - id: present
        run: |
          if [ -d station/tests/e2e ]; then echo "yes=true" >> "$GITHUB_OUTPUT"; else echo "yes=false" >> "$GITHUB_OUTPUT"; fi
      - name: Free disk space (torch / LeRobot wheels)
        if: steps.present.outputs.yes == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - if: steps.present.outputs.yes == 'true'
        uses: pnpm/action-setup@v6.1.1
        with: {version: "${{ env.PNPM_VERSION }}"}
      - if: steps.present.outputs.yes == 'true'
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build the Station SPA
        if: steps.present.outputs.yes == 'true'
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm build:station
      - if: steps.present.outputs.yes == 'true'
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "${{ env.UV_VERSION }}"
          enable-cache: true
          cache-dependency-glob: "station/uv.lock"
      - name: Sync + Playwright Chromium
        if: steps.present.outputs.yes == 'true'
        working-directory: station
        run: |
          uv sync --locked --python "$PYTHON_VERSION"
          uv run playwright install --with-deps chromium
      - name: e2e tests
        if: steps.present.outputs.yes == 'true'
        working-directory: station
        run: uv run pytest -q tests/e2e -m e2e

  email-worker:
    runs-on: ubuntu-24.04
    defaults:
      run: {working-directory: deploy/cloudflare/email-worker}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm
          cache-dependency-path: deploy/cloudflare/email-worker/package-lock.json
      - run: npm ci
      - run: npm run check
        env: {WRANGLER_SEND_METRICS: "false"}

  deploy-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with: {version: "${{ env.UV_VERSION }}"}
      - name: Compose files render (prod + dev)
        working-directory: deploy
        run: |
          docker compose --env-file .env.example config -q
          docker compose -f docker-compose.yml -f compose.dev.yml --env-file .env.example config -q
      - name: Exposure policy (loopback only, 18000, never 8000)
        run: |
          uv run --project deploy python deploy/scripts/check_compose.py --mode prod
          uv run --project deploy python deploy/scripts/check_compose.py --mode dev
      - name: Dashboards generated from source
        run: uv run --project deploy python deploy/scripts/gen_dashboards.py --check
      - name: hadolint
        run: |
          for f in deploy/docker/*.Dockerfile; do
            docker run --rm -i hadolint/hadolint:v2.15.1 hadolint --ignore DL3008 --ignore DL3018 --ignore DL3016 - < "$f"
          done
      - name: actionlint
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.12 -color

  deploy-smoke:
    # Builds the api + web images against stub app code and brings up the whole infra stack.
    runs-on: ubuntu-24.04
    needs: [deploy-lint]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with: {version: "${{ env.UV_VERSION }}"}
      - working-directory: deploy
        run: uv run pytest -q -m slow tests/test_stack_smoke.py

  images:
    name: image (${{ matrix.image }})
    runs-on: ubuntu-24.04
    needs: [deploy-lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: api, requires: backend/uv.lock}
          - {image: web, requires: frontend/pnpm-lock.yaml}
          - {image: worker-cpu, requires: worker/pyproject.toml}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: present
        run: |
          if [ -f "${{ matrix.requires }}" ]; then echo "yes=true" >> "$GITHUB_OUTPUT"; else echo "yes=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.present.outputs.yes == 'true'
        name: Build
        run: deploy/scripts/build-images.sh ${{ matrix.image }} --tag ci
      - if: steps.present.outputs.yes == 'true'
        name: Trivy (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: hibiscus/${{ matrix.image }}:ci
          version: v0.76.2
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
          vuln-type: os,library
          scanners: vuln,secret

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with: {version: "${{ env.UV_VERSION }}"}
      - uses: actions/setup-node@v7.1.0
        with: {node-version: "${{ env.NODE_VERSION }}"}
      - name: pip-audit (every uv project with a lock file)
        # input preparation (colour-free export, URL / local-version pins) and the reviewed
        # --ignore-vuln list live in the script, shared with `make audit`
        run: tools/pip_audit.sh backend worker cli deploy
      - name: npm audit (high+)
        run: |
          status=0
          for d in frontend deploy/cloudflare/email-worker; do
            if [ -f "$d/package-lock.json" ]; then (cd "$d" && npm audit --audit-level=high) || status=1; fi
            if [ -f "$d/pnpm-lock.yaml" ]; then (cd "$d" && npx --yes "pnpm@$PNPM_VERSION" audit --audit-level high) || status=1; fi
          done
          exit $status
      # secret scanning runs in .github/workflows/gitleaks.yml
