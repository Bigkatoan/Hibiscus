# Build the documentation site (mkdocs-material, --strict) on every PR touching docs, and deploy it
# to GitHub Pages from main: https://bigkatoan.github.io/Hibiscus/
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "tools/mkdocs_hooks.py"
      - "assets/brand/**"
      - "frontend/public/fonts/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "tools/mkdocs_hooks.py"
      - "assets/brand/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.8"
  NO_MKDOCS_2_WARNING: "1"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
        with: {version: "${{ env.UV_VERSION }}"}
      - name: mkdocs build --strict
        run: uv run --no-project --python 3.12 --with-requirements docs/requirements.txt mkdocs build --strict --site-dir site
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
