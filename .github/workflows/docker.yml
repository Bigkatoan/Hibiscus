# Build and publish the Hibiscus images to GHCR on version tags:
#   ghcr.io/bigkatoan/hibiscus-{api,web,worker-cpu,worker-gpu,worker-gpu-pascal}:{X.Y.Z,X.Y,latest}
# Build arguments mirror deploy/scripts/build-images.sh (keep them in sync).
name: docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      push:
        description: "Push the images (otherwise build only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # image names must be lower-case (GitHub owner names may contain capitals)
  IMAGE_PREFIX: ghcr.io/bigkatoan/hibiscus

jobs:
  image:
    name: ${{ matrix.image }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: deploy/docker/api.Dockerfile
            build-args: ""
          - image: web
            dockerfile: deploy/docker/web.Dockerfile
            build-args: ""
          - image: worker-cpu
            dockerfile: deploy/docker/worker.Dockerfile
            build-args: |
              RUNTIME_BASE=python:3.12.16-slim-trixie
              TORCH_INDEX_URL=https://download.pytorch.org/whl/cpu
              TORCH_PACKAGES=torch==2.15.0 torchvision==0.29.1
              TORCHCODEC_PACKAGE=torchcodec==0.17.0
              WORKER_VARIANT=cpu
          - image: worker-gpu
            dockerfile: deploy/docker/worker.Dockerfile
            build-args: |
              RUNTIME_BASE=nvidia/cuda:13.2.0-base-ubuntu24.04
              TORCH_INDEX_URL=https://pypi.org/simple
              TORCH_PACKAGES=torch==2.15.0 torchvision==0.29.2
              TORCHCODEC_PACKAGE=torchcodec==0.17.0
              WORKER_VARIANT=gpu
          - image: worker-gpu-pascal
            dockerfile: deploy/docker/worker.Dockerfile
            build-args: |
              RUNTIME_BASE=nvidia/cuda:12.6.3-base-ubuntu24.04
              TORCH_INDEX_URL=https://download.pytorch.org/whl/cu126
              TORCH_PACKAGES=torch==2.14.1 torchvision==0.29.1
              TORCHCODEC_PACKAGE=torchcodec==0.16.0
              WORKER_VARIANT=gpu-pascal
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Free disk space (CUDA + torch layers)
        if: startsWith(matrix.image, 'worker')
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - id: version
        run: |
          v="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then v="0.0.0-dev+${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push' || inputs.push
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=hibiscus-${{ matrix.image }}
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.documentation=https://bigkatoan.github.io/Hibiscus/
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' || inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VCS_REF=${{ github.sha }}
            HIBISCUS_VERSION=${{ steps.version.outputs.version }}
            ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@v3
        if: github.event_name == 'push' || inputs.push
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
