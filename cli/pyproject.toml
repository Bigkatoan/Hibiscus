[project]
name = "hibiscus"
version = "0.1.1"
description = "Hibiscus CLI: push LeRobot datasets, start training, follow logs, pull model bundles"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "typer>=0.12,<1",
    "httpx>=0.27,<0.29",
    "rich>=13.7",
    "keyring>=24",
    "platformdirs>=4",
    # runtime deps of the generated client (openapi-python-client 0.28.x)
    "attrs>=23.1",
    "python-dateutil>=2.8",
]

[project.scripts]
hibiscus = "hibiscus.main:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hibiscus"]

[tool.hatch.build.targets.sdist]
include = ["hibiscus", "README.md", "pyproject.toml"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6",
    "respx>=0.21",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-python-dateutil",
    "types-pyyaml",
    "types-jsonschema",
    "poethepoet>=0.29",
    # pinned: 0.27+ emits `typing.Self` (Python >= 3.11 only); the CLI must run on Python 3.10
    "openapi-python-client==0.28.4",
]

[tool.poe.tasks.gen-api]
help = "Regenerate hibiscus/_generated from ../api/openapi.yaml"
cmd = "python scripts/gen_api.py"

[tool.poe.tasks.check-api]
help = "Fail if hibiscus/_generated is stale"
cmd = "python scripts/gen_api.py --check"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not gpu and not slow'"
markers = ["gpu: needs a CUDA device", "slow: > 30 s"]

[tool.coverage.run]
source = ["hibiscus"]
omit = ["hibiscus/_generated/*"]

[tool.ruff]
line-length = 110
# The CLI runs on collect machines with Python 3.10 (deviation from py312, see docs/handoff/A9-cli.md)
target-version = "py310"
extend-exclude = ["hibiscus/_generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "N", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S311"]
"tests/fake_server.py" = ["S101", "S105", "N802"]
"hibiscus/main.py" = ["B008"]

[tool.mypy]
strict = true
python_version = "3.10"

# Generated code (openapi-python-client) is never hand-edited; its own typing has a few strict-mode
# findings (see docs/handoff/A9-cli.md). Its public signatures are still used to type-check our code.
[[tool.mypy.overrides]]
module = ["hibiscus._generated.*"]
ignore_errors = true
