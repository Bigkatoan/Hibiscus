[project]
name = "hibiscus-api"
version = "0.1.0"
description = "Hibiscus API (FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14",
    "redis>=5.2,<6",
    "aioboto3>=13",
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.10",
    "pyotp>=2.9",
    "cryptography>=43",
    "sse-starlette>=2.1",
    "prometheus-client>=0.21",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "structlog>=24.4",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
    "httpx>=0.28",
    "email-validator>=2.2",
]

[project.scripts]
hibiscus-bootstrap = "app.admin.bootstrap:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6",
    "testcontainers[postgres,redis,minio]>=4.8",
    "schemathesis>=3.38",
    "openapi-spec-validator>=0.7",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml",
    "types-aioboto3[s3]>=13",
    "aiosmtpd>=1.4",
    "types-jsonschema",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs testcontainers (docker)", "slow: > 30 s", "gpu: needs a CUDA device"]
addopts = "-m 'not gpu and not slow'"
filterwarnings = ["ignore::DeprecationWarning:testcontainers.*"]

[tool.coverage.run]
source = ["app"]
branch = true
concurrency = ["greenlet", "thread"]
omit = ["app/runs/policy_schema.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "N", "RUF"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path", "fastapi.Body", "fastapi.Cookie", "app.core.deps.require_scope", "app.core.deps.require_role"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"app/db/migrations/versions/**" = ["E501", "S608"]  # autogenerated DDL; S608: table names are literals from a fixed tuple

[tool.mypy]
strict = true
python_version = "3.12"
[[tool.mypy.overrides]]
module = ["lerobot.*", "draccus.*"]
ignore_missing_imports = true
[[tool.mypy.overrides]]
# test-only dependency without type information
module = ["testcontainers.*", "boto3", "boto3.*"]
ignore_missing_imports = true
