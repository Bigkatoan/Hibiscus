# Hibiscus documentation site (mkdocs-material, pixel theme).
#   uv run --no-project --with-requirements docs/requirements.txt mkdocs serve
#   uv run --no-project --with-requirements docs/requirements.txt mkdocs build --strict
# Published to GitHub Pages by .github/workflows/docs.yml.
site_name: Hibiscus
site_description: Self-hosted training platform for LeRobot policies, with a cozy pixel-art UI.
site_url: https://bigkatoan.github.io/Hibiscus/
repo_url: https://github.com/Bigkatoan/Hibiscus
repo_name: Bigkatoan/Hibiscus
edit_uri: edit/main/docs/
copyright: Hibiscus is free software under the GNU AGPL v3.0 · pixel art © the Hibiscus contributors

docs_dir: docs
hooks:
  - tools/mkdocs_hooks.py

# Internal engineering material stays out of the public site.
exclude_docs: |
  handoff/
  qa/
  security/
  PLAN.md
  OWNERSHIP.md
  CONTRACT_NOTES.md
  CONTRIBUTING.md
  db-schema.md
  runbook/README.md
  ux/README.md
  ux/copy-deck.md
  ux/personas.md
  ux/uat.md
  ux/user-flows.md
  ux/wireframes.md
  ux/tools/
  *.py
  requirements.txt

validation:
  nav:
    omitted_files: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: info
    unrecognized_links: info

theme:
  name: material
  language: en
  font: false # self-hosted Nunito (hibiscus-assets), see docs/stylesheets/hibiscus.css
  logo: assets/brand/logo-64.png
  favicon: assets/brand/favicon-32.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Night garden
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/white-balance-sunny
        name: Day garden
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

extra_css:
  - stylesheets/hibiscus.css

extra:
  generator: false
  alternate:
    - name: English
      link: /Hibiscus/user-guide/en/01-getting-started/
      lang: en
    - name: Tiếng Việt
      link: /Hibiscus/user-guide/vi/01-bat-dau/
      lang: vi
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Bigkatoan/Hibiscus
      name: Hibiscus on GitHub
    - icon: fontawesome/brands/docker
      link: https://github.com/Bigkatoan?tab=packages&repo_name=Hibiscus
      name: Container images on GHCR

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Hướng dẫn (Tiếng Việt):
      - Mục lục: user-guide/README.md
      - 1. Bắt đầu: user-guide/vi/01-bat-dau.md
      - 2. Dataset: user-guide/vi/02-dataset.md
      - 3. CLI trên máy collect: user-guide/vi/03-cli-may-collect.md
      - 4. Train model: user-guide/vi/04-train.md
      - 5. Đọc metrics: user-guide/vi/05-doc-metrics.md
      - 6. Chạy trên robot: user-guide/vi/06-chay-tren-robot.md
      - 7. Team và quản trị: user-guide/vi/07-team-quan-tri.md
      - 8. Xử lý sự cố: user-guide/vi/08-xu-ly-su-co.md
      - Hibiscus Station: user-guide/vi/station.md
  - User guide (English):
